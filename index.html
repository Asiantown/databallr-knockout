<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>databallr KNOCKOUT</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div id="hud-top">
        <div id="hud-title">databallr <span>KNOCKOUT</span></div>
        <div id="hud-alive"></div>
      </div>
      <div id="hud-line"></div>
      <div id="hud-message"></div>
      <div id="hud-status"></div>
      <div id="hud-meter">
        <div id="meter-track">
          <div id="meter-band"></div>
          <div id="meter-fill"></div>
          <div id="meter-tick"></div>
        </div>
        <div id="meter-label">flick up to shoot</div>
      </div>
      <div id="overlay">
        <div id="overlay-card">
          <h1>databallr <span>KNOCKOUT</span></h1>
          <p class="tagline">Free-throw knockout against real NBA shooters. Your make window is your player's real career FT%.</p>
          <div class="pick-label">SHOOT AS</div>
          <div id="pick-shooter"></div>
          <div class="pick-label">OPPONENTS</div>
          <div id="pick-count"></div>
          <button id="btn-start">START</button>
          <p class="hint">Flick up with mouse / trackpad / finger. Sharper flick = more power. Land in the green window.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
