<!doctype html>
<!-- DEV calibration harness (not shipped). Loads a video and runs MediaPipe on
     EVERY frame via seek — decoupled from inference speed — to get a dense 30fps
     landmark timeseries for tuning the flick. /flickcal.html?v=/_flickcal.mp4 -->
<html>
<head><meta charset="utf-8"></head>
<body>
<video id="v" muted playsinline></video>
<script type="module">
import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';
const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const v = document.getElementById('v');
v.src = new URLSearchParams(location.search).get('v');
let lm;
(async () => {
  const vision = await FilesetResolver.forVisionTasks(WASM);
  lm = await HandLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: MODEL, delegate: 'GPU' },
    numHands: 1, runningMode: 'VIDEO',
    minHandDetectionConfidence: 0.3, minHandPresenceConfidence: 0.3, minTrackingConfidence: 0.3,
  });
  await new Promise((r) => { if (v.readyState >= 1) r(); else v.onloadedmetadata = () => r(); });
  window.__READY__ = true;
})();

// Seek through every frame; feed each to detectForVideo with a monotonic
// timestamp spaced at the real frame interval. Inference slowness doesn't matter
// — we await each seek — so we get the full-rate landmark track.
window.__PROCESS_ALL__ = async (fps = 30) => {
  const dur = v.duration;
  const step = 1 / fps;
  const out = [];
  let ts = 0;
  for (let t = 0; t < dur - 1e-3; t += step) {
    v.currentTime = t;
    await new Promise((r) => { v.onseeked = () => r(); });
    ts += 1000 / fps;
    const h = lm.detectForVideo(v, ts).landmarks?.[0];
    out.push(h
      ? { t: Math.round(t * 1000), has: 1, wristY: +h[0].y.toFixed(4), tipY: +h[12].y.toFixed(4), knuckleY: +h[9].y.toFixed(4), sig: +(h[0].y - h[12].y).toFixed(4) }
      : { t: Math.round(t * 1000), has: 0 });
  }
  return out;
};
</script>
</body>
</html>
